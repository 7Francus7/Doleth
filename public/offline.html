<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F7F5F1">
    <title>Sin conexión · Doleth</title>
    <style>
      :root { color-scheme: light; font-family: Manrope, system-ui, sans-serif; background: #f7f5f1; color: #272926; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #d9d7cf; border-radius: 24px; background: #fffdf8; box-shadow: 0 12px 36px rgb(48 53 49 / 8%); }
      img { width: 44px; height: 44px; }
      h1 { margin: 24px 0 8px; font-family: Georgia, serif; font-size: 32px; font-weight: 400; line-height: 1.1; color: #173f39; }
      p { margin: 0; color: #5f625d; font-size: 16px; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; margin-top: 24px; padding: 0 20px; align-items: center; justify-content: center; border-radius: 12px; background: #184e47; color: #fffdf8; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #184e47; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img alt="" src="/brand/doleth-mark.svg">
      <h1>Estás sin conexión</h1>
      <p>
        Doleth no guarda páginas financieras para usarlas offline. Volvé a
        conectarte para ver información actual y confiable.
      </p>
      <a href="/ahora">Reintentar</a>
    </main>
  </body>
</html>
